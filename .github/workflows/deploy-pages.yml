name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開は1度に1つだけ。進行中のものは終わらせてから次へ
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - run: npm run build

      # リンク検査はビルド結果を見るので build のあと
      - run: npm run check

      # 初回だけ、リポジトリの Settings > Pages > Source を "GitHub Actions" に
      # しておく必要がある。GITHUB_TOKEN には Pages サイトを新規作成する権限が
      # ないので、enablement: true を付けてもここで失敗する。
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

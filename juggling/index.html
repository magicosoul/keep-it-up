<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 公開URL。別のドメインに移すときはこの3ファイルの canonical / og:url / og:image を直す -->
    <link rel="canonical" href="https://magicosoul.github.io/keep-it-up/juggling/" />
    <link rel="icon" href="data:image/svg+xml,&lt;svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22&gt;&lt;text y=%22.9em%22 font-size=%2290%22&gt;⚽&lt;/text&gt;&lt;/svg&gt;" />
    <meta name="theme-color" content="#0b1220" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="KEEP IT UP!" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:title" content="リフティング | KEEP IT UP!" />
    <meta property="og:description" content="ボールを落とさないように蹴り続けるサッカーアクション。左右に動いてボールの下に入り、タイミングを合わせて足を出す。" />
    <meta property="og:url" content="https://magicosoul.github.io/keep-it-up/juggling/" />

  <body>
    <div id="app">
      <header class="topbar">
        <div>
          <h1>KEEP IT UP!</h1>
          <p>Phase 1: foot juggling feel test</p>
        </div>
        <div class="hud">
          <div>Score <strong id="score">0</strong></div>
          <div>Combo <strong id="combo">0</strong></div>
          <div>Status <strong id="status">Ready</strong></div>
        </div>
      </header>

      <canvas id="game" width="960" height="540" aria-label="KEEP IT UP game canvas"></canvas>

      <section class="controls-help">
        <p>Move: Arrow Left / Arrow Right</p>
        <p>Kick: A = left foot, D = right foot</p>
        <p>Start / Restart: Space</p>
        <p><a href="../">トップに戻る</a></p>
      </section>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
